<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Destileria</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header>
        <img class="logo" src="/img/ChatGPT Image 15 jun 2026, 17_57_02.png">
        <h1>¡Bienvenido a la Destileria!</h1>
    </header>

    <main>
        <section id="contenedor-productos" class="productos-grid"></section>

        <aside id="carrito">
            <h2>Tu Carrito</h2>
            <div id="items-carrito"></div>
            <div id="totales">
                <p>Total: $<span id="precio-total">0</span></p>
                <button id="vaciar-carrito">Vaciar Carrito</button>
                <button id="finalizar-compra">Finalizar Compra</button>
            </div>
        </aside>
    </main>

    <script src="/Js/scripts.js"></script>
</body>
</html>
